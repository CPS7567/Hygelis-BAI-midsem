  </g><text x="158" y="96" font-family="Inter" font-weight="600" font-size="26" fill="#0B1220" opacity="1" letter-spacing="2.86" text-anchor="start">HYGELIS</text><text x="1824" y="95" font-family="Inter" font-weight="600" font-size="20" fill="#526071" opacity="1" letter-spacing="1.6" text-anchor="end">PERSONA 01 / 04 · WHERE THE EVIDENCE BEGINS</text><circle cx="200" cy="280" r="110" fill="#FFFFFF" stroke="#18B6A4" stroke-width="5"/><clipPath id="avharleen"><circle cx="200" cy="280" r="104"/></clipPath><g clip-path="url(#avharleen)"><rect x="96" y="176" width="208" height="208" fill="#E6EEF9"/><g transform="translate(0 1.62)"><path d="M70 559.4133333333333 Q63.06666666666666 342.74666666666667 148 328.88 L252 328.88 Q336.93333333333334 342.74666666666667 330 559.4133333333333 Z" fill="#2E8C84"/><path d="M70 559.4133333333333 Q63.06666666666666 342.74666666666667 148 328.88 L184.4 412.08 L174 559.4133333333333 Z" fill="#FFFFFF"/><path d="M330 559.4133333333333 Q336.93333333333334 342.74666666666667 252 328.88 L215.6 412.08 L226 559.4133333333333 Z" fill="#FFFFFF"/><path d="M165.33333333333331 335.81333333333333 Q154.93333333333334 429.4133333333333 193.06666666666666 438.08 Q226 438.08 234.66666666666669 335.81333333333333" fill="none" stroke="#2B3445" stroke-width="6.066666666666666" stroke-linecap="round"/><circle cx="193.06666666666666" cy="441.5466666666666" r="10.4" fill="#9AA6B8" stroke="#2B3445" stroke-width="4.333333333333334"/><circle cx="200" cy="219.97466666666668" r="21.112" fill="#1E1614"/><ellipse cx="200" cy="261.1933333333333" rx="54.288000000000004" ry="51.272" fill="#1E1614"/><rect x="185.92533333333333" y="306.43333333333334" width="28.149333333333335" height="30.159999999999997" fill="#ae7a57"/><ellipse cx="150.73866666666666" cy="274.2626666666667" rx="8.042666666666667" ry="11.058666666666667" fill="#C68B63"/><ellipse cx="249.26133333333334" cy="274.2626666666667" rx="8.042666666666667" ry="11.058666666666667" fill="#C68B63"/><ellipse cx="200" cy="271.24666666666667" rx="50.266666666666666" ry="52.27733333333333" fill="#C68B63"/><ellipse cx="181.904" cy="272.252" rx="3.7699999999999996" ry="5.529333333333334" fill="#1B1F2A"/><ellipse cx="218.096" cy="272.252" rx="3.7699999999999996" ry="5.529333333333334" fill="#1B1F2A"/><path d="M173.86133333333333 261.1933333333333 q8.042666666666667 -5.026666666666667 16.085333333333335 0 M210.05333333333334 261.1933333333333 q8.042666666666667 -5.026666666666667 16.085333333333335 0" fill="none" stroke="#2A2320" stroke-width="3.016" stroke-linecap="round"/><path d="M187.936 289.3426666666667 q12.064 10.053333333333335 24.128 0" fill="none" stroke="#5A3B2C" stroke-width="3.518666666666667" stroke-linecap="round"/><circle cx="172.35333333333332" cy="285.3213333333333" r="6.032" fill="#E0876A" opacity="0.35"/><circle cx="227.64666666666668" cy="285.3213333333333" r="6.032" fill="#E0876A" opacity="0.35"/><path d="M150.73866666666666 266.22 Q154.76 218.46666666666667 205.02666666666667 221.98533333333333 Q247.75333333333333 223.49333333333334 249.26133333333334 266.22 Q230.16 235.05466666666666 197.48666666666668 240.08133333333333 Q168.83466666666666 241.08666666666667 150.73866666666666 266.22 Z" fill="#1E1614"/></g></g><text x="332" y="258" font-family="Inter" font-weight="700" font-size="40" fill="#0B1220" opacity="1" letter-spacing="-1" text-anchor="start">Dr. Harleen Kaur</text><text x="332" y="296" font-family="Inter" font-weight="600" font-size="21" fill="#0B1220" opacity="1" letter-spacing="-0.21" text-anchor="start">38 · Pharmacovigilance Physician</text><text x="332" y="326" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Tertiary-care teaching hospital · Patiala, Punjab</text><rect x="332" y="346" width="380" height="38" rx="19" fill="#dff5f2" /><text x="522" y="371.48" font-family="Inter" font-weight="600" font-size="18" fill="#0E6E63" opacity="1" letter-spacing="0" text-anchor="middle">Patiala · clinical observation</text><text x="96" y="444" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Sees suspected adverse drug reactions in routine clinical care</text><text x="96" y="476" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Documents them and reports through the hospital’s established</text><text x="96" y="508" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">ADR reporting route · not a Hygelis user or buyer</text><rect x="96" y="560" width="6" height="126" rx="3" fill="#18B6A4"/><text x="124" y="592" font-family="Inter" font-weight="600" font-size="27" fill="#0B1220" opacity="1" letter-spacing="-0.3" text-anchor="start">“I can investigate the case in front of me.</text><text x="124" y="632" font-family="Inter" font-weight="600" font-size="27" fill="#0B1220" opacity="1" letter-spacing="-0.3" text-anchor="start">I can’t manually search every other case</text><text x="124" y="672" font-family="Inter" font-weight="600" font-size="27" fill="#0B1220" opacity="1" letter-spacing="-0.3" text-anchor="start">that might be connected to it.”</text><text x="96" y="743" font-family="Inter" font-weight="500" font-size="19" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Buying power</text><rect x="346" y="731" width="380" height="10" rx="5" fill="#E4E9F0"/><rect x="346" y="731" width="19" height="10" rx="5" fill="#2F80ED"/><text x="96" y="787" font-family="Inter" font-weight="500" font-size="19" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Hands-on Hygelis use</text><text x="346" y="787" font-family="Inter" font-weight="500" font-size="17" fill="#7C8796" opacity="1" letter-spacing="0" text-anchor="start">none: not a Hygelis user</text><text x="96" y="831" font-family="Inter" font-weight="500" font-size="19" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Need for traceability</text><rect x="346" y="819" width="380" height="10" rx="5" fill="#E4E9F0"/><rect x="346" y="819" width="228" height="10" rx="5" fill="#2F80ED"/><rect x="96" y="866" width="660" height="138" rx="14" fill="#0B1220"/><text x="126" y="910" font-family="Inter" font-weight="600" font-size="16" fill="#18B6A4" opacity="1" letter-spacing="2" text-anchor="start">WHAT SUCCESS LOOKS LIKE</text><text x="126" y="948" font-family="Inter" font-weight="600" font-size="23" fill="#FFFFFF" opacity="1" letter-spacing="-0.23" text-anchor="start">A complete, timely report that gets</text><text x="126" y="979" font-family="Inter" font-weight="600" font-size="23" fill="#FFFFFF" opacity="1" letter-spacing="-0.23" text-anchor="start">looked at alongside related cases</text><rect x="860" y="176" width="964" height="194" rx="14" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="2"/><text x="888" y="214" font-family="Inter" font-weight="700" font-size="17" fill="#0B1220" opacity="1" letter-spacing="2" text-anchor="start">PAINS</text><circle cx="894" cy="245" r="5" fill="#0B1220"/><text x="912" y="252" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">She sees one patient’s reaction, never the wider pattern</text><circle cx="894" cy="279" r="5" fill="#0B1220"/><text x="912" y="286" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Reporting competes with a full clinical workload</text><circle cx="894" cy="313" r="5" fill="#0B1220"/><text x="912" y="320" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">She rarely learns what happens after a report is sent</text><circle cx="894" cy="347" r="5" fill="#0B1220"/><text x="912" y="354" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Newer medicines have little real-world safety history yet</text><rect x="860" y="386" width="964" height="160" rx="14" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="2"/><text x="888" y="424" font-family="Inter" font-weight="700" font-size="17" fill="#2F80ED" opacity="1" letter-spacing="2" text-anchor="start">GOALS</text><circle cx="894" cy="455" r="5" fill="#2F80ED"/><text x="912" y="462" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Report suspected reactions accurately and on time</text><circle cx="894" cy="489" r="5" fill="#2F80ED"/><text x="912" y="496" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Know that serious observations are assessed in context</text><circle cx="894" cy="523" r="5" fill="#2F80ED"/><text x="912" y="530" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Keep patients on new medicines safe</text><rect x="860" y="562" width="964" height="160" rx="14" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="2"/><text x="888" y="600" font-family="Inter" font-weight="700" font-size="17" fill="#18B6A4" opacity="1" letter-spacing="2" text-anchor="start">WHAT SHE NEEDS FROM THE SYSTEM</text><circle cx="894" cy="631" r="5" fill="#18B6A4"/><text x="912" y="638" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">One established way to report, not another portal</text><circle cx="894" cy="665" r="5" fill="#18B6A4"/><text x="912" y="672" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Patient privacy respected at every step</text><circle cx="894" cy="699" r="5" fill="#18B6A4"/><text x="912" y="706" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Her observation treated as evidence, not noise</text><rect x="860" y="866" width="964" height="138" rx="14" fill="#e3f6f4" stroke="#a3e2db" stroke-width="2"/><text x="888" y="904" font-family="Inter" font-weight="700" font-size="16" fill="#0E6E63" opacity="1" letter-spacing="2" text-anchor="start">WHAT HYGELIS CHANGES (AND DOESN’T)</text><text x="888" y="936" font-family="Inter" font-weight="500" font-size="18.5" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Nothing in her workflow: Hygelis never sees her hospital’s records. If her report reaches Company A</text><text x="888" y="962" font-family="Inter" font-weight="500" font-size="18.5" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">through the existing route, Hygelis can link it with similar cases and literature, so one observation</text><text x="888" y="988" font-family="Inter" font-weight="500" font-size="18.5" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">can become part of a properly investigated signal.</text><text x="96" y="1044" font-family="Inter" font-weight="500" font-size="15" fill="#7C8796" opacity="1" letter-spacing="0" text-anchor="start">Fictional persona · Hygelis, Company A and NAREVIA™ are fictional · real places shown for context only; no affiliation or data-sharing implied · DES530 The Business of AI</text></svg>