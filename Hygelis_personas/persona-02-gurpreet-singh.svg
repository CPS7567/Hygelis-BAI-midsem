  </g><text x="158" y="96" font-family="Inter" font-weight="600" font-size="26" fill="#0B1220" opacity="1" letter-spacing="2.86" text-anchor="start">HYGELIS</text><text x="1824" y="95" font-family="Inter" font-weight="600" font-size="20" fill="#526071" opacity="1" letter-spacing="1.6" text-anchor="end">PERSONA 02 / 04 · THE DAILY USER</text><circle cx="200" cy="280" r="110" fill="#FFFFFF" stroke="#2F80ED" stroke-width="5"/><clipPath id="avgurpreet"><circle cx="200" cy="280" r="104"/></clipPath><g clip-path="url(#avgurpreet)"><rect x="96" y="176" width="208" height="208" fill="#E6EEF9"/><g transform="translate(0 1.50)"><path d="M70 559.4133333333333 Q63.06666666666666 342.74666666666667 148 328.88 L252 328.88 Q336.93333333333334 342.74666666666667 330 559.4133333333333 Z" fill="#9CC3F0"/><path d="M161.86666666666667 330.61333333333334 L200 368.74666666666667 L238.13333333333333 330.61333333333334 L220.8 327.14666666666665 L200 347.94666666666666 L179.2 327.14666666666665 Z" fill="#DCEBFB"/><rect x="185.92533333333333" y="306.43333333333334" width="28.149333333333335" height="30.159999999999997" fill="#9b6b4b"/><ellipse cx="150.73866666666666" cy="274.2626666666667" rx="8.042666666666667" ry="11.058666666666667" fill="#B07A55"/><ellipse cx="249.26133333333334" cy="274.2626666666667" rx="8.042666666666667" ry="11.058666666666667" fill="#B07A55"/><ellipse cx="200" cy="271.24666666666667" rx="50.266666666666666" ry="52.27733333333333" fill="#B07A55"/><path d="M151.744 273.76 Q154.76 334.08 200 337.59866666666665 Q245.24 334.08 248.256 273.76 Q235.18666666666667 296.38 215.07999999999998 292.3586666666667 Q200 287.332 184.92000000000002 292.3586666666667 Q164.81333333333333 296.38 151.744 273.76 Z" fill="#1E1614"/><path d="M188.94133333333332 302.412 q11.058666666666667 7.037333333333334 22.117333333333335 0" fill="none" stroke="#6d6866" stroke-width="3.016" stroke-linecap="round"/><ellipse cx="181.904" cy="272.252" rx="3.7699999999999996" ry="5.529333333333334" fill="#1B1F2A"/><ellipse cx="218.096" cy="272.252" rx="3.7699999999999996" ry="5.529333333333334" fill="#1B1F2A"/><path d="M173.86133333333333 261.1933333333333 q8.042666666666667 -5.026666666666667 16.085333333333335 0 M210.05333333333334 261.1933333333333 q8.042666666666667 -5.026666666666667 16.085333333333335 0" fill="none" stroke="#2A2320" stroke-width="3.016" stroke-linecap="round"/><path d="M148.728 262.19866666666667 Q144.70666666666665 198.36 200 195.84666666666666 Q255.29333333333335 198.36 251.272 262.19866666666667 Q200 240.08133333333333 148.728 262.19866666666667 Z" fill="#2F5FB8"/><path d="M152.24666666666667 250.13466666666667 Q194.97333333333333 205.9 245.24 231.03333333333333" fill="none" stroke="#23478a" stroke-width="4.524" stroke-linecap="round"/><path d="M164.81333333333333 225.00133333333332 Q205.02666666666667 198.36 247.75333333333333 246.11333333333334" fill="none" stroke="#23478a" stroke-width="3.518666666666667" stroke-linecap="round" opacity="0.7"/></g></g><text x="332" y="258" font-family="Inter" font-weight="700" font-size="40" fill="#0B1220" opacity="1" letter-spacing="-1" text-anchor="start">Gurpreet Singh</text><text x="332" y="296" font-family="Inter" font-weight="600" font-size="21" fill="#0B1220" opacity="1" letter-spacing="-0.21" text-anchor="start">31 · Pharmacovigilance Safety Analyst</text><text x="332" y="326" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Company A · India PV team · Mohali, Punjab</text><rect x="332" y="346" width="368.79999999999995" height="38" rx="19" fill="#dff5f2" /><text x="516.4" y="371.48" font-family="Inter" font-weight="600" font-size="18" fill="#0E6E63" opacity="1" letter-spacing="0" text-anchor="middle">Mohali · signal investigation</text><text x="96" y="444" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Reviews safety cases for completeness and follow-up needs</text><text x="96" y="476" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Screens literature and checks for duplicate or similar cases</text><text x="96" y="508" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Prepares the evidence senior reviewers decide on</text><rect x="96" y="560" width="6" height="126" rx="3" fill="#18B6A4"/><text x="124" y="592" font-family="Inter" font-weight="600" font-size="27" fill="#0B1220" opacity="1" letter-spacing="-0.3" text-anchor="start">“The hard part isn’t finding one case.</text><text x="124" y="632" font-family="Inter" font-weight="600" font-size="27" fill="#0B1220" opacity="1" letter-spacing="-0.3" text-anchor="start">It’s figuring out whether ten different</text><text x="124" y="672" font-family="Inter" font-weight="600" font-size="27" fill="#0B1220" opacity="1" letter-spacing="-0.3" text-anchor="start">pieces of evidence are telling us the same story.”</text><text x="96" y="743" font-family="Inter" font-weight="500" font-size="19" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Buying power</text><rect x="346" y="731" width="380" height="10" rx="5" fill="#E4E9F0"/><rect x="346" y="731" width="114" height="10" rx="5" fill="#2F80ED"/><text x="96" y="787" font-family="Inter" font-weight="500" font-size="19" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Hands-on Hygelis use</text><rect x="346" y="775" width="380" height="10" rx="5" fill="#E4E9F0"/><rect x="346" y="775" width="380" height="10" rx="5" fill="#2F80ED"/><text x="96" y="831" font-family="Inter" font-weight="500" font-size="19" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Need for traceability</text><rect x="346" y="819" width="380" height="10" rx="5" fill="#E4E9F0"/><rect x="346" y="819" width="304" height="10" rx="5" fill="#2F80ED"/><rect x="96" y="866" width="660" height="138" rx="14" fill="#0B1220"/><text x="126" y="910" font-family="Inter" font-weight="600" font-size="16" fill="#18B6A4" opacity="1" letter-spacing="2" text-anchor="start">WHAT SUCCESS LOOKS LIKE</text><text x="126" y="948" font-family="Inter" font-weight="600" font-size="23" fill="#FFFFFF" opacity="1" letter-spacing="-0.23" text-anchor="start">A review-ready evidence package,</text><text x="126" y="979" font-family="Inter" font-weight="600" font-size="23" fill="#FFFFFF" opacity="1" letter-spacing="-0.23" text-anchor="start">built without days of manual searching</text><rect x="860" y="176" width="964" height="194" rx="14" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="2"/><text x="888" y="214" font-family="Inter" font-weight="700" font-size="17" fill="#0B1220" opacity="1" letter-spacing="2" text-anchor="start">PAINS</text><circle cx="894" cy="245" r="5" fill="#0B1220"/><text x="912" y="252" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Evidence is scattered across cases, literature and past reviews</text><circle cx="894" cy="279" r="5" fill="#0B1220"/><text x="912" y="286" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Manual searches and duplicate checks eat most of the week</text><circle cx="894" cy="313" r="5" fill="#0B1220"/><text x="912" y="320" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Hard to show reviewers why a pattern matters</text><circle cx="894" cy="347" r="5" fill="#0B1220"/><text x="912" y="354" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Worry that a real signal sits in cases he hasn’t reached yet</text><rect x="860" y="386" width="964" height="160" rx="14" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="2"/><text x="888" y="424" font-family="Inter" font-weight="700" font-size="17" fill="#2F80ED" opacity="1" letter-spacing="2" text-anchor="start">GOALS</text><circle cx="894" cy="455" r="5" fill="#2F80ED"/><text x="912" y="462" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Spend his time on judgment, not searching</text><circle cx="894" cy="489" r="5" fill="#2F80ED"/><text x="912" y="496" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Hand over complete, consistent evidence packages</text><circle cx="894" cy="523" r="5" fill="#2F80ED"/><text x="912" y="530" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Catch real signals earlier, with fewer false alarms</text><rect x="860" y="562" width="964" height="194" rx="14" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="2"/><text x="888" y="600" font-family="Inter" font-weight="700" font-size="17" fill="#18B6A4" opacity="1" letter-spacing="2" text-anchor="start">WHAT HE NEEDS FROM HYGELIS</text><circle cx="894" cy="631" r="5" fill="#18B6A4"/><text x="912" y="638" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Every finding traced back to its source</text><circle cx="894" cy="665" r="5" fill="#18B6A4"/><text x="912" y="672" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Conflicts and uncertainty shown, not smoothed over</text><circle cx="894" cy="699" r="5" fill="#18B6A4"/><text x="912" y="706" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Fits the existing safety database and review process</text><circle cx="894" cy="733" r="5" fill="#18B6A4"/><text x="912" y="740" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">He decides what goes forward; nothing is sent automatically</text><rect x="860" y="866" width="964" height="138" rx="14" fill="#e3f6f4" stroke="#a3e2db" stroke-width="2"/><text x="888" y="904" font-family="Inter" font-weight="700" font-size="16" fill="#0E6E63" opacity="1" letter-spacing="2" text-anchor="start">WHAT HYGELIS CHANGES FOR THEM</text><text x="888" y="936" font-family="Inter" font-weight="500" font-size="18.5" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">From searching for signals to investigating them. Hygelis runs the multi-step investigation (related</text><text x="888" y="962" font-family="Inter" font-weight="500" font-size="18.5" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">cases, literature, history, alternative explanations, conflicts) and Gurpreet reviews a structured</text><text x="888" y="988" font-family="Inter" font-weight="500" font-size="18.5" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">package instead of assembling one by hand.</text><text x="96" y="1044" font-family="Inter" font-weight="500" font-size="15" fill="#7C8796" opacity="1" letter-spacing="0" text-anchor="start">Fictional persona · Hygelis, Company A and NAREVIA™ are fictional · real places shown for context only; no affiliation or data-sharing implied · DES530 The Business of AI</text></svg>