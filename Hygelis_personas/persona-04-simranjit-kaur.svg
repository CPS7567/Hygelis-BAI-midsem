  </g><text x="158" y="96" font-family="Inter" font-weight="600" font-size="26" fill="#0B1220" opacity="1" letter-spacing="2.86" text-anchor="start">HYGELIS</text><text x="1824" y="95" font-family="Inter" font-weight="600" font-size="20" fill="#526071" opacity="1" letter-spacing="1.6" text-anchor="end">PERSONA 04 / 04 · THE GOVERNANCE GATEKEEPER</text><circle cx="200" cy="280" r="110" fill="#FFFFFF" stroke="#18B6A4" stroke-width="5"/><clipPath id="avsimranjit"><circle cx="200" cy="280" r="104"/></clipPath><g clip-path="url(#avsimranjit)"><rect x="96" y="176" width="208" height="208" fill="#E6EEF9"/><g transform="translate(0 1.72)"><path d="M70 559.4133333333333 Q63.06666666666666 342.74666666666667 148 328.88 L252 328.88 Q336.93333333333334 342.74666666666667 330 559.4133333333333 Z" fill="#3B4A63"/><path d="M161.86666666666667 330.61333333333334 L200 368.74666666666667 L238.13333333333333 330.61333333333334 L220.8 327.14666666666665 L200 347.94666666666666 L179.2 327.14666666666665 Z" fill="#E9EEF6"/><rect x="253.73333333333335" y="412.08" width="39.86666666666667" height="26" rx="4.333333333333334" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="1.7333333333333334"/><rect x="260.6666666666667" y="420.74666666666667" width="26" height="4.333333333333334" rx="2" fill="#18B6A4"/><path d="M142.19333333333333 316.4866666666667 Q134.65333333333334 208.41333333333336 200 214.948 Q265.3466666666667 208.41333333333336 257.8066666666667 316.4866666666667 Z" fill="#221816"/><rect x="185.92533333333333" y="306.43333333333334" width="28.149333333333335" height="30.159999999999997" fill="#ae7a57"/><ellipse cx="150.73866666666666" cy="274.2626666666667" rx="8.042666666666667" ry="11.058666666666667" fill="#C68B63"/><ellipse cx="249.26133333333334" cy="274.2626666666667" rx="8.042666666666667" ry="11.058666666666667" fill="#C68B63"/><ellipse cx="200" cy="271.24666666666667" rx="50.266666666666666" ry="52.27733333333333" fill="#C68B63"/><ellipse cx="181.904" cy="272.252" rx="3.7699999999999996" ry="5.529333333333334" fill="#1B1F2A"/><ellipse cx="218.096" cy="272.252" rx="3.7699999999999996" ry="5.529333333333334" fill="#1B1F2A"/><path d="M173.86133333333333 261.1933333333333 q8.042666666666667 -5.026666666666667 16.085333333333335 0 M210.05333333333334 261.1933333333333 q8.042666666666667 -5.026666666666667 16.085333333333335 0" fill="none" stroke="#2A2320" stroke-width="3.016" stroke-linecap="round"/><path d="M187.936 289.3426666666667 q12.064 10.053333333333335 24.128 0" fill="none" stroke="#5A3B2C" stroke-width="3.518666666666667" stroke-linecap="round"/><circle cx="172.35333333333332" cy="285.3213333333333" r="6.032" fill="#E0876A" opacity="0.35"/><circle cx="227.64666666666668" cy="285.3213333333333" r="6.032" fill="#E0876A" opacity="0.35"/><path d="M149.73333333333335 271.24666666666667 Q159.78666666666666 215.95333333333332 215.07999999999998 223.49333333333334 Q250.26666666666665 231.03333333333333 250.26666666666665 271.24666666666667 Q220.10666666666668 243.6 189.94666666666666 241.08666666666667 Q164.81333333333333 246.11333333333334 149.73333333333335 271.24666666666667 Z" fill="#221816"/></g></g><text x="332" y="258" font-family="Inter" font-weight="700" font-size="40" fill="#0B1220" opacity="1" letter-spacing="-1" text-anchor="start">Simranjit Kaur</text><text x="332" y="296" font-family="Inter" font-weight="600" font-size="21" fill="#0B1220" opacity="1" letter-spacing="-0.21" text-anchor="start">35 · PV Quality &amp; Compliance Lead</text><text x="332" y="326" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Company A · Chandigarh, Punjab</text><rect x="332" y="346" width="301.59999999999997" height="38" rx="19" fill="#dff5f2" /><text x="482.79999999999995" y="371.48" font-family="Inter" font-weight="600" font-size="18" fill="#0E6E63" opacity="1" letter-spacing="0" text-anchor="middle">Chandigarh · governance</text><text x="96" y="444" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Owns PV quality systems, SOPs and audit readiness</text><text x="96" y="476" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Prepares the team for inspections and internal audits</text><text x="96" y="508" font-family="Inter" font-weight="500" font-size="20" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Must sign off before any new system goes live</text><rect x="96" y="560" width="6" height="86" rx="3" fill="#18B6A4"/><text x="124" y="592" font-family="Inter" font-weight="600" font-size="27" fill="#0B1220" opacity="1" letter-spacing="-0.3" text-anchor="start">“Show me everything Hygelis used</text><text x="124" y="632" font-family="Inter" font-weight="600" font-size="27" fill="#0B1220" opacity="1" letter-spacing="-0.3" text-anchor="start">to reach this conclusion.”</text><text x="96" y="743" font-family="Inter" font-weight="500" font-size="19" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Buying power</text><rect x="346" y="731" width="380" height="10" rx="5" fill="#E4E9F0"/><rect x="346" y="731" width="228" height="10" rx="5" fill="#2F80ED"/><text x="96" y="787" font-family="Inter" font-weight="500" font-size="19" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Hands-on Hygelis use</text><rect x="346" y="775" width="380" height="10" rx="5" fill="#E4E9F0"/><rect x="346" y="775" width="114" height="10" rx="5" fill="#2F80ED"/><text x="96" y="831" font-family="Inter" font-weight="500" font-size="19" fill="#526071" opacity="1" letter-spacing="0" text-anchor="start">Need for traceability</text><rect x="346" y="819" width="380" height="10" rx="5" fill="#E4E9F0"/><rect x="346" y="819" width="380" height="10" rx="5" fill="#2F80ED"/><rect x="96" y="866" width="660" height="138" rx="14" fill="#0B1220"/><text x="126" y="910" font-family="Inter" font-weight="600" font-size="16" fill="#18B6A4" opacity="1" letter-spacing="2" text-anchor="start">WHAT SUCCESS LOOKS LIKE</text><text x="126" y="948" font-family="Inter" font-weight="600" font-size="23" fill="#FFFFFF" opacity="1" letter-spacing="-0.23" text-anchor="start">Every signal decision fully traceable</text><text x="126" y="979" font-family="Inter" font-weight="600" font-size="23" fill="#FFFFFF" opacity="1" letter-spacing="-0.23" text-anchor="start">at audit, with nothing reconstructed</text><rect x="860" y="176" width="964" height="194" rx="14" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="2"/><text x="888" y="214" font-family="Inter" font-weight="700" font-size="17" fill="#0B1220" opacity="1" letter-spacing="2" text-anchor="start">PAINS</text><circle cx="894" cy="245" r="5" fill="#0B1220"/><text x="912" y="252" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Decisions documented differently by each reviewer</text><circle cx="894" cy="279" r="5" fill="#0B1220"/><text x="912" y="286" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Rebuilding the history of an old signal decision is slow</text><circle cx="894" cy="313" r="5" fill="#0B1220"/><text x="912" y="320" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">AI outputs that can’t be traced or reproduced</text><circle cx="894" cy="347" r="5" fill="#0B1220"/><text x="912" y="354" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Unclear who approved what, and when</text><rect x="860" y="386" width="964" height="160" rx="14" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="2"/><text x="888" y="424" font-family="Inter" font-weight="700" font-size="17" fill="#2F80ED" opacity="1" letter-spacing="2" text-anchor="start">GOALS</text><circle cx="894" cy="455" r="5" fill="#2F80ED"/><text x="912" y="462" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Inspection-ready traceability for every signal</text><circle cx="894" cy="489" r="5" fill="#2F80ED"/><text x="912" y="496" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Clear accountability for each human decision</text><circle cx="894" cy="523" r="5" fill="#2F80ED"/><text x="912" y="530" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">The same controls across products and teams</text><rect x="860" y="562" width="964" height="194" rx="14" fill="#FFFFFF" stroke="#E4E9F0" stroke-width="2"/><text x="888" y="600" font-family="Inter" font-weight="700" font-size="17" fill="#18B6A4" opacity="1" letter-spacing="2" text-anchor="start">WHAT SHE NEEDS FROM HYGELIS</text><circle cx="894" cy="631" r="5" fill="#18B6A4"/><text x="912" y="638" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Source provenance and a full investigation log</text><circle cx="894" cy="665" r="5" fill="#18B6A4"/><text x="912" y="672" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Model and version history for every output</text><circle cx="894" cy="699" r="5" fill="#18B6A4"/><text x="912" y="706" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Human approval records with reviewer identity</text><circle cx="894" cy="733" r="5" fill="#18B6A4"/><text x="912" y="740" font-family="Inter" font-weight="500" font-size="21" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Role-based access, access logs and retention controls</text><rect x="860" y="866" width="964" height="138" rx="14" fill="#e3f6f4" stroke="#a3e2db" stroke-width="2"/><text x="888" y="904" font-family="Inter" font-weight="700" font-size="16" fill="#0E6E63" opacity="1" letter-spacing="2" text-anchor="start">WHAT HYGELIS CHANGES FOR THEM</text><text x="888" y="936" font-family="Inter" font-weight="500" font-size="18.5" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">Every signal carries its own audit trail: sources, reasoning, confidence, conflicting evidence,</text><text x="888" y="962" font-family="Inter" font-weight="500" font-size="18.5" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">model version and the human decision, linked and preserved. Personal data is minimised,</text><text x="888" y="988" font-family="Inter" font-weight="500" font-size="18.5" fill="#0B1220" opacity="1" letter-spacing="0" text-anchor="start">access-controlled and logged, in line with India’s DPDP Act.</text><text x="96" y="1044" font-family="Inter" font-weight="500" font-size="15" fill="#7C8796" opacity="1" letter-spacing="0" text-anchor="start">Fictional persona · Hygelis, Company A and NAREVIA™ are fictional · real places shown for context only; no affiliation or data-sharing implied · DES530 The Business of AI</text></svg>